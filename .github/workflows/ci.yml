name: Validate site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check Astro and TypeScript
        run: npm run check
      - name: Build static site
        run: npm run build
