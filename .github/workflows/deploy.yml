name: Publish The Bullshit Bureau (static HTML)

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - ".nojekyll"
      - "docs/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Validate source files
        run: |
          test -s index.html
          test -s docs/index.html
          test -s docs/assets/css/newspaper.css
          test -s docs/assets/js/newspaper.js
          test -f docs/.nojekyll
          python3 -m json.tool docs/data/posts.json > /dev/null
          python3 -m json.tool docs/data/site.json > /dev/null

      - name: Assemble site with root entry point
        run: |
          rm -rf _site
          mkdir -p _site/docs
          cp index.html _site/index.html
          cp -a docs/. _site/docs/
          cp docs/404.html _site/404.html
          cp docs/robots.txt _site/robots.txt
          cp docs/sitemap.xml _site/sitemap.xml
          touch _site/.nojekyll

      - name: Upload static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site
          include-hidden-files: true

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
