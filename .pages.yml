media:
  - name: images
    label: Imagens do jornal
    input: docs/assets/images/uploads
    output: /The-Bullshit-Bureau/assets/images/uploads
    extensions:
      - jpg
      - jpeg
      - png
      - webp
      - avif
    categories:
      - image
    rename: safe

content:
  - name: publications
    label: Publicações
    type: file
    path: docs/data/posts.json
    format: json
    list: true
    fields:
      - name: title
        label: Título
        type: string
        required: true
      - name: slug
        label: URL amigável
        type: string
        required: true
        pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
      - name: subtitle
        label: Linha fina
        type: text
      - name: excerpt
        label: Resumo
        type: text
        required: true
      - name: section
        label: Editoria
        type: select
        required: true
        options:
          values:
            - name: noticias
              label: Notícias
            - name: artigos
              label: Artigos e análises
            - name: editoriais
              label: Editorial
            - name: opiniao
              label: Opinião
      - name: category
        label: Categoria
        type: select
        required: true
        options:
          values:
            - name: Política
              label: Política
            - name: Economia
              label: Economia
            - name: Brasil
              label: Brasil
            - name: Mundo
              label: Mundo
            - name: Tecnologia
              label: Tecnologia
            - name: Educação
              label: Educação
            - name: Ciência
              label: Ciência
            - name: Cultura
              label: Cultura
            - name: Sociedade
              label: Sociedade
            - name: Jornalismo
              label: Jornalismo
      - name: author
        label: Autor
        type: string
        required: true
      - name: publishedAt
        label: Data de publicação
        type: date
        required: true
      - name: status
        label: Status
        type: select
        required: true
        options:
          values:
            - name: draft
              label: Rascunho
            - name: published
              label: Publicado
      - name: featured
        label: Manchete principal
        type: boolean
      - name: cover
        label: Imagem de capa
        type: image
        options:
          media: images
          path: docs/assets/images/uploads
          extensions:
            - jpg
            - jpeg
            - png
            - webp
            - avif
          rename: safe
      - name: coverAlt
        label: Texto alternativo da imagem
        type: string
      - name: coverCredit
        label: Crédito da imagem
        type: string
      - name: coverCreditUrl
        label: Link da fonte da imagem
        type: string
      - name: coverLicenseUrl
        label: Link da licença da imagem
        type: string
      - name: body
        label: Texto da matéria
        type: rich-text
        required: true
        options:
          format: html
          media: images
          path: docs/assets/images/uploads
          extensions:
            - jpg
            - jpeg
            - png
            - webp
            - avif
          rename: safe
          switcher: false

  - name: site
    label: Identidade do jornal
    type: file
    path: docs/data/site.json
    format: json
    fields:
      - name: name
        label: Nome do jornal
        type: string
      - name: slogan
        label: Slogan
        type: string
      - name: description
        label: Descrição
        type: text
